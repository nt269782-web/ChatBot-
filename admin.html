<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBot Admin Panel</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 30px;
        }
        .container {
            width: min(900px, 100%);
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,.2);
        }
        h2 { text-align: center; color: #2563eb; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            margin-right: 6px;
        }
        button:hover { background: #1d4ed8; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            word-break: break-word;
        }
        th { background: #2563eb; color: white; }
        .edit { background: #15803d; }
        .delete { background: #dc2626; }
        .cancel { background: #6b7280; display: none; }
        #status {
            margin-top: 12px;
            text-align: center;
            min-height: 20px;
            font-weight: bold;
        }
        @media (max-width: 650px) {
            body { padding: 10px; }
            th, td { padding: 7px; font-size: 13px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h2>ChatBot Admin Panel</h2>

    <input type="text" id="question" placeholder="Enter Question">
    <input type="text" id="answer" placeholder="Enter Answer">

    <button id="saveButton" type="button">Save</button>
    <button id="cancelButton" class="cancel" type="button">Cancel Edit</button>

    <div id="status"></div>

    <hr>

    <h2>All Questions</h2>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Question</th>
            <th>Answer</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script src="/admin.js"></script>
</body>
</html>
